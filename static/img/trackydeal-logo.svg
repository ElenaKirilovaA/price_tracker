<svg width="420" height="110" viewBox="0 0 420 110"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="dealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd27d"/>
      <stop offset="100%" stop-color="#ff9f43"/>
    </linearGradient>

    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ec4b6"/>
      <stop offset="100%" stop-color="#1f4e79"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(10,20)">
    <circle cx="30" cy="30" r="28" fill="url(#iconGradient)"/>
    <polyline
      points="14,34 24,24 34,30 44,18"
      fill="none"
      stroke="#ffffff"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="44" cy="18" r="4" fill="#ffffff"/>
  </g>

  <!-- Text -->
  <text x="90" y="65"
        font-family="Inter, Arial, sans-serif"
        font-size="48"
        font-weight="700"
        fill="#ffffff">
    Tracky
  </text>

  <text x="220" y="65"
        font-family="Inter, Arial, sans-serif"
        font-size="48"
        font-weight="700"
        fill="url(#dealGradient)">
    Deal
  </text>
</svg>
